          + '<a href="tel:+905550165335" data-mag="1" style="font-size:14px;font-weight:700;padding:14px 28px;border-radius:999px;border:1.5px solid '+c.line+';color:'+c.fgSoft+';transition:transform 0.25s cubic-bezier(0.22,1,0.36,1);">+90 555 016 53 35</a>'
          + '<a href="Hakan-Sagiroglu-CV-'+(lang==='tr'?'TR':'EN')+'.pdf" download="Hakan-Sagiroglu-CV-'+(lang==='tr'?'TR':'EN')+'.pdf" data-mag="1" class="no-print" style="font-size:14px;font-weight:700;padding:14px 28px;border-radius:999px;border:1.5px solid '+c.line+';background:transparent;color:'+c.fgSoft+';transition:transform 0.25s cubic-bezier(0.22,1,0.36,1);">'+esc(t.download)+' ↓</a>'
        + '</div>'
        + '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:clamp(50px,7vw,80px);padding-top:24px;border-top:1px solid '+c.line+';font-family:'+MONO+';font-size:12px;color:'+c.fgMut+';"><span>© 2026 Hakan Sağıroğlu</span><span>Bursa, TR · '+esc(t.remote)+'</span></div>'
      + '</div></div>'
      + '</div>';

    var app = document.getElementById('app');
    app.innerHTML = html;
    document.documentElement.lang = lang;
    wire(c);
    fx();
    startTw(PHRASES[lang]);
  }

  var twRAF = null;
  function startTw(list) {
    if (twRAF) { cancelAnimationFrame(twRAF); twRAF = null; }
    var w = document.getElementById('tw-w'), a = document.getElementById('tw-a');
    if (!w || !a || !list || !list.length) return;
    var reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (reduce) { w.textContent = list[0].a + ' '; a.textContent = list[0].b; return; }
    var GL = '#%&$*+=/<>xkzmn0123456789';
    function g(k, e) { return GL.charAt((Math.floor(e / 72) + k * 5) % GL.length); }
    var i = 0, state = 'w', t0 = performance.now() + 380;
    var perW = 32, perA = 44, winA = 230, hold = 2400, perD = 16, pause = 300;
    function meta() { var p = list[i % list.length], full = p.a + ' ' + p.b, as = p.a.length + 1; return { full: full, as: as, N: full.length, aLen: full.length - as }; }
    var m = meta();
    function frame(now) {
      var e = now - t0, full = m.full, as = m.as, N = m.N, wt = '', at = '', k, ch;
      if (state === 'w') {
        var wl = Math.max(0, Math.floor(e / perW)); if (wl > as) wl = as;
        wt = full.slice(0, wl); at = '';
        if (e >= as * perW) { state = 'a'; t0 = now; }
      } else if (state === 'a') {
        wt = full.slice(0, as);
        for (k = 0; k < m.aLen; k++) {
          var s = k * perA;
          if (e >= s + winA) ch = full.charAt(as + k);
          else if (e >= s) ch = full.charAt(as + k) === ' ' ? ' ' : g(k, e);
          else ch = '';
          at += ch;
        }
        if (e >= (m.aLen - 1) * perA + winA) { state = 'hold'; t0 = now; }
      } else if (state === 'hold') {
        wt = full.slice(0, as); at = full.slice(as);
        if (e >= hold) { state = 'del'; t0 = now; }
      } else {
        var keep = N - Math.floor(e / perD); if (keep < 0) keep = 0;
        wt = full.slice(0, Math.min(keep, as)); at = keep > as ? full.slice(as, keep) : '';
        if (keep <= 0) { i++; m = meta(); state = 'w'; t0 = now + pause; }
      }
      w.textContent = wt; a.textContent = at;
      twRAF = requestAnimationFrame(frame);
    }
    twRAF = requestAnimationFrame(frame);
  }

  function save(next) {
    Object.assign(state, next);
    try { localStorage.setItem('hs-cv3-prefs', JSON.stringify({ lang: state.lang, dark: state.dark })); } catch (e) {}
    render();
  }

  function wire(c) {
    document.querySelectorAll('[data-lang]').forEach(function(b){ b.onclick = function(){ save({ lang: b.getAttribute('data-lang') }); }; });
    var th = document.querySelector('[data-theme]'); if (th) th.onclick = function(){ save({ dark: !state.dark }); };
    document.querySelectorAll('[data-job]').forEach(function(el){
      el.onclick = function(){ var i = el.getAttribute('data-job'); state.open[i] = !state.open[i]; render(); };
    });
    var canHover = true;
    try { canHover = window.matchMedia('(hover: hover)').matches; } catch (e) {}
    if (canHover) document.querySelectorAll('.chip').forEach(function(el){
      el.onmouseenter = function(){ el.style.background = c.accent; el.style.color = c.onAccent; el.style.transform = 'translateY(-3px)'; };
      el.onmouseleave = function(){ el.style.background = c.chipBg; el.style.color = c.fgSoft; el.style.transform = 'translateY(0)'; };
    });
  }

  var done = new WeakSet(), vio = null;
  function fx() {
    document.querySelectorAll('[data-stat]').forEach(function(el){
      if (done.has(el)) return; done.add(el);
      var io = new IntersectionObserver(function(es){
        es.forEach(function(en){
          if (!en.isIntersecting) return; io.disconnect();
          var final = el.textContent, m = final.match(/(\d+)/); if (!m) return;
          var target = parseInt(m[1],10), t0 = performance.now(), dur = 1300;
          function step(now){ var p = Math.max(0, Math.min(1,(now-t0)/dur)), e = 1-Math.pow(1-p,3);
            el.textContent = final.replace(m[1], String(Math.round(target*e)));
            if (p<1) requestAnimationFrame(step); }
          requestAnimationFrame(step);
        });
      }, { threshold: 0.5 });
      io.observe(el);
    });
    var reduceM = false;
    try { reduceM = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    document.querySelectorAll('[data-skills]').forEach(function(grid){
      var chips = [].slice.call(grid.querySelectorAll('.chip'));
      if (!chips.length) return;
      if (reduceM) return;
      chips.forEach(function(el){
        el.style.opacity = '0';
        el.style.transform = 'translateY(14px) scale(0.9)';
        el.style.transition = 'opacity .5s cubic-bezier(.22,1,.36,1), transform .5s cubic-bezier(.22,1,.36,1), background .2s, color .2s';
      });
      var io = new IntersectionObserver(function(es){
        es.forEach(function(en){
          if (!en.isIntersecting) return; io.disconnect();
          chips.forEach(function(el, idx){
            setTimeout(function(){ el.style.opacity = '1'; el.style.transform = 'translateY(0) scale(1)'; }, idx * 34);
          });
        });
      }, { threshold: 0.12 });
      io.observe(grid);
    });
    // Project demos: fetch and play only while near the viewport
    if (vio) vio.disconnect();
    if (!reduceM && 'IntersectionObserver' in window) {
      vio = new IntersectionObserver(function(es){
        es.forEach(function(en){
          var v = en.target;
          if (en.isIntersecting) { var pl = v.play(); if (pl && pl.catch) pl.catch(function(){}); }
          else if (!v.paused) v.pause();
        });
      }, { rootMargin: '200px 0px' });
      document.querySelectorAll('video[data-lazy]').forEach(function(v){ vio.observe(v); });
    }
    heroMedia(reduceM);
  }

  // Hero background loop: one persistent <video>, moved into each re-render,
  // loaded only after the page has finished loading
  var heroVid = null;
  function heroMedia(reduceM) {
    var slot = document.querySelector('.hbg');
    if (!slot) return;
    if (heroVid) { slot.appendChild(heroVid); return; }
    var saveData = false;
    try { saveData = !!(navigator.connection && navigator.connection.saveData); } catch (e) {}
    if (reduceM || saveData) return;
    var v = heroVid = document.createElement('video');
    v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'none';
    v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('aria-hidden', 'true');
    v.addEventListener('playing', function(){ v.classList.add('on'); }, { once: true });
    slot.appendChild(v);
    var go = function(){
      var mobile = false;
      try { mobile = window.matchMedia('(max-width: 767px)').matches; } catch (e) {}
      v.src = 'assets/hero/curve' + (mobile ? '-m' : '') + '.mp4';
      var pl = v.play(); if (pl && pl.catch) pl.catch(function(){});
      if ('IntersectionObserver' in window) new IntersectionObserver(function(es){
        es.forEach(function(en){
          if (en.isIntersecting) { var p2 = v.play(); if (p2 && p2.catch) p2.catch(function(){}); }
          else if (!v.paused) v.pause();
        });
      }).observe(v);
    };
    var idle = function(){ (window.requestIdleCallback || function(f){ setTimeout(f, 300); })(go, { timeout: 2500 }); };
    if (document.readyState === 'complete') idle(); else window.addEventListener('load', idle, { once: true });
  }

  render();
})();
</script>
